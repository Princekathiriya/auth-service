# Included in EVERY location block. nginx gotcha: a location with its own add_header
# (like Cache-Control) silently drops all add_header lines inherited from the server block,
# so headers set only at server level would vanish exactly where we set caching.
#
# Same idea as helmet() on the API. CSP: scripts only from our own origin; the page may only
# make requests to itself and the API (${API_URL} is filled in when the container starts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ${API_URL}; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
