# Serves the built React app. nginx-unprivileged runs as a non-root user, so it listens on 8080.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Don't advertise the nginx version.
  server_tokens off;

  # Built JS/CSS have a content hash in their name (index-DJ0XBPFv.js), so they can be cached forever:
  # a new build produces new file names.
  location /assets/ {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: /verify-email, /admin, ... don't exist as files. Serve index.html and
  # let React Router handle the path. Without this, opening an email link gives a 404.
  location / {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "no-cache"; # always check for a new index.html (it points at the new assets)
    try_files $uri $uri/ /index.html;
  }
}
